# .github/workflows/upload-protected.yml
name: Upload Protected Files

on:
  push:
    branches: [ main ]
    paths:
      - 'protected/**'    
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload protected content as artifact
        uses: actions/upload-artifact@v4
        with:
          name: protected-content
          path: protected/
